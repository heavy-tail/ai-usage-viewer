name: Request compatibility baseline acceptance

# This workflow is intentionally unprivileged and never uses a self-hosted
# runner. Its successful main-branch completion asks the default-branch canary
# workflow to collect a fresh baseline behind the protected environment.
on:
  workflow_dispatch:

permissions: {}

jobs:
  request:
    name: Request protected baseline acceptance
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record the request
        shell: bash
        run: echo "The protected default-branch canary will request reviewer approval."
