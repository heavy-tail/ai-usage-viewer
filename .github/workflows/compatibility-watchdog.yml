name: Monitor Provider Compatibility Canary

on:
  schedule:
    - cron: "47 * * * *"
  workflow_run:
    workflows: ["Provider Compatibility Canary"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: provider-compatibility-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    name: Check canary heartbeat
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write

    steps:
      - name: Alert when the independent canary heartbeat is unhealthy
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          marker='<!-- usage-viewer-canary-watchdog -->'
          title='Provider compatibility canary heartbeat is unhealthy'
          now="$(date -u +%s)"
          runs="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/compatibility-canary.yml/runs?per_page=30")"
          latest="$(jq -c \
            '[.workflow_runs[] | select(.event == "schedule")] | sort_by(.created_at) | last // empty' \
            <<<"$runs")"
          latest_success="$(jq -c \
            '[.workflow_runs[] | select(.event == "schedule" and .status == "completed" and .conclusion == "success")] | sort_by(.created_at) | last // empty' \
            <<<"$runs")"

          unhealthy=false
          reason='Canary heartbeat is healthy.'
          run_url="https://github.com/$GITHUB_REPOSITORY/actions/workflows/compatibility-canary.yml"
          if [[ -z "$latest" ]]; then
            unhealthy=true
            reason='No scheduled canary run was found.'
          else
            status="$(jq -r '.status' <<<"$latest")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$latest")"
            created_at="$(jq -r '.created_at' <<<"$latest")"
            run_url="$(jq -r '.html_url' <<<"$latest")"
            age_seconds="$((now - $(date -u -d "$created_at" +%s)))"
            if [[ "$status" == 'completed' && "$conclusion" != 'success' ]]; then
              unhealthy=true
              reason="Latest scheduled canary completed with: $conclusion."
            elif [[ "$status" != 'completed' && $age_seconds -gt 2700 ]]; then
              unhealthy=true
              reason="Latest scheduled canary has remained $status for more than 45 minutes."
            fi
          fi

          if [[ "$unhealthy" == 'false' ]]; then
            if [[ -z "$latest_success" ]]; then
              unhealthy=true
              reason='No successful scheduled canary run was found.'
            else
              success_at="$(jq -r '.created_at' <<<"$latest_success")"
              success_age="$((now - $(date -u -d "$success_at" +%s)))"
              if [[ $success_age -gt 36000 ]]; then
                unhealthy=true
                reason='The latest successful scheduled canary is more than 10 hours old.'
              fi
            fi
          fi

          issues="$(gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/issues?state=all&per_page=100")"
          managed="$(jq -c --arg marker "$marker" \
            '[.[][] | select(has("pull_request") | not) | select((.body // "") | contains($marker))] | sort_by(.number) | first // empty' \
            <<<"$issues")"
          managed_json="${managed:-null}"
          issue_number="$(jq -r '.number // empty' <<<"$managed_json")"
          issue_state="$(jq -r '.state // empty' <<<"$managed_json")"
          body_file="$RUNNER_TEMP/canary-watchdog-issue.md"
          cat >"$body_file" <<EOF
          $marker
          This issue is managed by a GitHub-hosted watchdog that is independent from the provider-authenticated self-hosted runner.

          - **Status:** $reason
          - **Checked:** $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          - **Latest run:** $run_url

          The canary normally runs every six hours. This watchdog alerts after 45 minutes queued/running or 10 hours without a successful scheduled run.
          EOF

          if [[ "$unhealthy" == 'true' ]]; then
            if [[ -z "$issue_number" ]]; then
              gh issue create --title "$title" --body-file "$body_file"
            else
              gh issue edit "$issue_number" --title "$title" --body-file "$body_file"
              if [[ "$issue_state" != 'open' ]]; then
                gh issue reopen "$issue_number"
              fi
            fi
          elif [[ -n "$issue_number" && "$issue_state" == 'open' ]]; then
            gh issue close "$issue_number" \
              --comment 'The scheduled provider compatibility canary heartbeat recovered.'
          fi
